name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package_script: package:app:mac
          - os: windows-latest
            package_script: package:app:win

    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore build tool binaries
        run: pnpm rebuild esbuild
      - name: Build and package desktop app
        run: pnpm ${{ matrix.package_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore build tool binaries
        run: pnpm rebuild esbuild
      - name: Build and package extension
        run: pnpm package:extension
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: release/*Chrome-Extension.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [desktop, extension]
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "Whisky Manager ${GITHUB_REF_NAME}" --generate-notes
